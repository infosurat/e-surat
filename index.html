<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>e-Surat Kecamatan Seberuang</title>

<meta name="description" content="Sistem e-Surat Kecamatan Seberuang — Layanan digital untuk pengelolaan surat masuk dan keluar berbasis web.">
<meta name="keywords" content="e-surat, surat digital, Kecamatan Seberuang, surat masuk, surat keluar, e-surat kapuas hulu">
<meta name="author" content="Kecamatan Seberuang">

<!-- Meta Sosial -->
<meta property="og:title" content="e-Surat Kecamatan Seberuang">
<meta property="og:description" content="Sistem e-Surat Kecamatan Seberuang — Layanan digital untuk pengelolaan surat masuk dan keluar berbasis web.">
<meta property="og:url" content="https://infosurat.github.io/e-surat/">
<meta property="og:type" content="website">
<meta property="og:image" content="https://www.kapuashulukab.go.id/home/public/assets/images/pages/pages_70Logo-KH-Baru.png">

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
    :root {
      --green: #0f8b66;
      --green-dark: #0b6b4f;
      --bg: #f5f7f6;
      --card: #ffffff;
      --muted: #666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: #222;
    }
    .center-wrap {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      width: 360px;
      background: var(--card);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.08);
      text-align: center;
    }
    .login-card .logo { width: 110px; margin-bottom: 10px; }
    .login-card h1 { margin: 6px 0 12px; color: var(--green); }
    input[type="text"], input[type="password"], input[type="date"] {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 8px; margin-top: 6px;
    }
    .btn {
      background: var(--green); color: #fff;
      border: none; padding: 10px 14px;
      border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: var(--green-dark); }
    .hidden { display: none; }
    .topbar {
      background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .topbar .logo-sm { width: 44px; }
    .container { max-width: 1000px; margin: 22px auto; padding: 0 16px; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: var(--green); color: #fff; }

    /* Kartu dashboard */
    .cards { display: flex; gap: 14px; justify-content: center; margin-bottom: 18px; }
    .card {
      background: var(--card); border-radius: 10px; padding: 18px 22px; min-width: 160px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      box-shadow: 0 6px 18px rgba(16,24,40,0.06);
      border: 1px solid rgba(15,139,102,0.06); cursor: pointer;
    }
    .card .icon { font-size: 28px; }
    .card .label { font-weight: 600; color: var(--green); }

    /* Area penyimpan kalimat */
    #kalimatBox {
      background: white;
      padding: 16px;
      border-radius: 12px;
      margin-top: 30px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
    }
    #kalimatBox input {
      width: 100%; padding: 10px;
      border: 1px solid #ccc; border-radius: 8px;
    }
    #kalimatBox button {
      margin-top: 10px; padding: 8px 12px;
      background: var(--green); color: white; border: none;
      border-radius: 8px; cursor: pointer;
    }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="center-wrap" id="loginPage">
  <div class="login-card">
    <img src="https://i.imgur.com/mnBT8hv.png" class="logo">
    <h1> E-SURAT KECAMATAN SEBERUANG</h1>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit" class="btn">Login</button>
      <div id="error" style="color:red;margin-top:8px;"></div>
    </form>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardPage" class="hidden">
  <div class="topbar">
    <div class="brand">
      <img src="https://i.imgur.com/mnBT8hv.png" class="logo-sm">
      <h1 style="font-size:18px;color:#0f8b66;margin-left:10px;">e-Surat Kecamatan Seberuang</h1>
    </div>
    <button class="logout" onclick="logout()">Logout</button>
  </div>

  <main class="container">

    <!-- Kartu pilihan -->
    <div class="cards">
      <button class="card" id="btnMasuk"><div class="icon">📥</div><div class="label">Surat Masuk</div></button>
      <button class="card" id="btnKeluar"><div class="icon">📤</div><div class="label">Surat Keluar</div></button>
      <button class="card" id="btnDisposisi"><div class="icon">📄</div><div class="label">Disposisi</div></button>
    </div>

    <!-- Form -->
    <section id="formArea" class="hidden">
      <h2 id="formTitle">Form</h2>
      <form id="suratForm">
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
          <div><label>Nomor</label><input type="text" id="nomor" required></div>
          <div><label>Nomor Surat</label><input type="text" id="nomorSurat" required></div>
          <div><label>Tanggal Surat</label><input type="date" id="tanggalSurat" required></div>
          <div><label>Hal</label><input type="text" id="hal" required></div>
          <div><label id="tglLabel">Tanggal</label><input type="date" id="tanggalKirimTerima" required></div>
          <div><label id="asalTujuanLabel">Asal/Tujuan</label><input type="text" id="asalTujuan" required></div>
        </div>
        <button type="submit" class="btn" style="margin-top:12px;">Simpan</button>
      </form>
    </section>

    <!-- Tabel -->
    <h3 id="tableTitle">Daftar Surat</h3>
    <div id="tableSection">
      <table>
        <thead>
          <tr>
            <th>Nomor</th><th>Nomor Surat</th><th>Tanggal Surat</th><th>Hal</th><th>Tanggal</th><th>Asal/Tujuan</th><th>Aksi</th>
          </tr>
        </thead>
        <tbody id="dataBody"></tbody>
      </table>
    </div>

    <button class="pdf-btn" onclick="downloadPDF()">Download PDF</button>

  

<script>
// ---------------- LOGIN --------------------
const akun = {
  umum:"umum123", kesra:"kesra123", ekbang:"ekbang123",
  trantib:"trantib123", pem:"pem123", sekcam:"sekcam123",
  kecamatanseberuang:"seberuang123"
};
document.getElementById('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  const u=username.value.trim(), p=password.value.trim();
  if(akun[u]===p){
    localStorage.setItem("user",u);
    loginPage.classList.add("hidden");
    dashboardPage.classList.remove("hidden");
  } else error.textContent="Username atau password salah.";
});
function logout(){ localStorage.removeItem("user"); location.reload(); }

window.onload = ()=>{
  if(localStorage.getItem("user")){
    loginPage.classList.add("hidden");
    dashboardPage.classList.remove("hidden");
  }
};

// ---------------- FITUR SURAT --------------------
const ENDPOINT_MASUK="https://sheetdb.io/api/v1/f10drm0h22cjz";
const ENDPOINT_KELUAR="https://sheetdb.io/api/v1/247yl7pptsbkc";
let endpointAktif=null;

btnMasuk.onclick=()=>setJenis("masuk");
btnKeluar.onclick=()=>setJenis("keluar");
btnDisposisi.onclick=()=>window.location.href="https://infosurat.github.io/kertas-disposisi/";

function setJenis(j){
  endpointAktif = j==="masuk"?ENDPOINT_MASUK:ENDPOINT_KELUAR;
  formArea.classList.remove("hidden");
  formTitle.textContent = j==="masuk"?"Form Surat Masuk":"Form Surat Keluar";
  tableTitle.textContent = j==="masuk"?"Daftar Surat Masuk":"Daftar Surat Keluar";
  tglLabel.textContent = j==="masuk"?"Tanggal Diterima":"Tanggal Dikirim";
  asalTujuanLabel.textContent = j==="masuk"?"Asal Surat":"Tujuan Surat";
  loadData();
}

// simpan data sheetdb
suratForm.addEventListener("submit",async e=>{
  e.preventDefault();
  const payload={data:[{
    Nomor:nomor.value,Nomor_Surat:nomorSurat.value,
    Tanggal_Surat:tanggalSurat.value,Hal:hal.value,
    Tanggal_Diterima_Dikirim:tanggalKirimTerima.value,
    Asal_Tujuan_Surat:asalTujuan.value
  }]};
  await fetch(endpointAktif,{
    method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(payload)
  });
  alert("Tersimpan!");
  suratForm.reset();
  loadData();
});

// load tabel
async function loadData(){
  const res=await fetch(endpointAktif);
  const data=await res.json();
  dataBody.innerHTML="";
  data.forEach((d,i)=>{
    dataBody.innerHTML+=`
      <tr>
        <td>${d.Nomor||""}</td>
        <td>${d.Nomor_Surat||""}</td>
        <td>${d.Tanggal_Surat||""}</td>
        <td>${d.Hal||""}</td>
        <td>${d.Tanggal_Diterima_Dikirim||""}</td>
        <td>${d.Asal_Tujuan_Surat||""}</td>
        <td><button onclick="hapus(${i})">Hapus</button></td>
      </tr>`;
  });
}

// hapus
async function hapus(i){
  if(!confirm("Yakin hapus?"))return;
  const res=await fetch(endpointAktif);
  const data=await res.json();
  const id=data[i].Nomor;
  await fetch(`${endpointAktif}/Nomor/${id}`,{method:"DELETE"});
  loadData();
}

// Download PDF
async function downloadPDF(){
  const el=document.getElementById("tableSection");
  const opt={
    margin:0.3,
    filename:"e-surat.pdf",
    image:{type:"jpeg",quality:1},
    html2canvas:{scale:2,scrollY:0},
    jsPDF:{unit:"in",format:"a4",orientation:"landscape"}
  };
  html2pdf().set(opt).from(el).save();
}



tampil();
</script>

</body>
</html>
