<style>
    :root {
      --green: #0f8b66;
      --green-dark: #0b6b4f;
      --bg: #f5f7f6;
      --card: #ffffff;
      --muted: #666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, Segoe UI, Arial, sans-serif;
      background: var(--bg);
      color: #222;
    }
    .center-wrap {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .login-card {
      width: 360px;
      background: var(--card);
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(2,6,23,0.08);
      text-align: center;
    }
    .login-card .logo { width: 110px; margin-bottom: 10px; }
    .login-card h1 { margin: 6px 0 12px; color: var(--green); }
    input[type="text"], input[type="password"], input[type="date"] {
      width: 100%; padding: 10px; border: 1px solid #ccc;
      border-radius: 8px; margin-top: 6px;
    }
    .btn {
      background: var(--green); color: #fff;
      border: none; padding: 10px 14px;
      border-radius: 8px; cursor: pointer; font-weight: 600;
    }
    .btn:hover { background: var(--green-dark); }
    .error { color: #d9534f; margin-top: 8px; }
    .small { font-size: 13px; color: var(--muted); }
    .hidden { display: none; }
    .topbar {
      background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      padding: 12px 16px; display: flex; justify-content: space-between; align-items: center;
    }
    .topbar .logo-sm { width: 44px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 18px; margin: 0; color: var(--green); }
    .logout {
      background: #dc3545; color: #fff; border: none;
      border-radius: 6px; padding: 6px 10px; cursor: pointer;
    }
    .container { max-width: 1000px; margin: 22px auto; padding: 0 16px; }
    .cards {
      display: flex; gap: 14px; justify-content: center; margin-bottom: 18px;
    }
    .card {
      background: var(--card); border-radius: 10px;
      padding: 18px 22px; min-width: 160px;
      display: flex; flex-direction: column; align-items: center;
      gap: 8px; box-shadow: 0 6px 18px rgba(16,24,40,0.06);
      border: 1px solid rgba(15,139,102,0.06); cursor: pointer;
    }
    .card .icon { font-size: 28px; }
    .card .label { font-weight: 600; color: var(--green); }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    th { background: var(--green); color: #fff; }
    td button {
      background: #dc3545; border: none; color: #fff;
      padding: 4px 8px; border-radius: 5px; cursor: pointer;
    }
    .pdf-btn {
      background: #444; color: #fff; border: none;
      padding: 8px 14px; border-radius: 8px; cursor: pointer;
      margin-top: 12px; float: right;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="center-wrap" id="loginPage">
    <div class="login-card">
      <img src="https://i.imgur.com/mnBT8hv.png" class="logo">
      <h1> E-SURAT KECAMATAN SEBERUANG</h1>
      <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" class="btn">Login</button>
        <div id="error" class="error"></div>
      </form>
      <p class="small">Masuk menggunakan akun <b>kecamatanseberuang</b></p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboardPage" class="hidden">
    <div class="topbar">
      <div class="brand">
        <img src="https://i.imgur.com/mnBT8hv.png" class="logo-sm">
        <h1>e-Surat Kecamatan Seberuang</h1>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <main class="container">
  <div class="cards">
    <button class="card" id="btnMasuk">
      <div class="icon">📥</div>
      <div class="label">Surat Masuk</div>
    </button>

    <button class="card" id="btnKeluar">
      <div class="icon">📤</div>
      <div class="label">Surat Keluar</div>
    </button>

    <!-- 🔹 Tambahan tombol Disposisi -->
    <button class="card" id="btnDisposisi">
      <div class="icon">📄</div>
      <div class="label">Disposisi</div>
    </button>
  </div>
</main>
<div style="text-align:center; margin:30px 0;">
  <button
    style="background:#0f8b66; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;"
    onclick="window.open('https://forta02.github.io/e-surat-kecamatan/')">
    📥 Download Data Surat
  </button>

<script>
  // Tombol Disposisi menuju link langsung
  document.getElementById("btnDisposisi").addEventListener("click", function() {
    window.location.href = "https://infosurat.github.io/kertas-disposisi/";
  });
</script>


      <section id="formArea" class="hidden">
        <h2 id="formTitle">Form</h2>
        <form id="suratForm">
          <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;">
            <div><label>Nomor</label><input type="text" id="nomor" required></div>
            <div><label>Nomor Surat</label><input type="text" id="nomorSurat" required></div>
            <div><label>Tanggal Surat</label><input type="date" id="tanggalSurat" required></div>
            <div><label>Hal</label><input type="text" id="hal" required></div>
            <div><label id="tglLabel">Tanggal Diterima / Dikirim</label><input type="date" id="tanggalKirimTerima" required></div>
            <div><label id="asalTujuanLabel">Asal / Tujuan Surat</label><input type="text" id="asalTujuan" required></div>
          </div>
          <div style="margin-top:12px;">
            <button type="submit" class="btn">Simpan</button>
            <button type="button" class="btn" style="background:#ccc;color:#000" onclick="batalForm()">Batal</button>
          </div>
        </form>
      </section>

      <h3 id="tableTitle">Daftar Surat</h3>
      <div id="tableSection">
        <table>
          <thead>
            <tr>
              <th>Nomor</th><th>Nomor Surat</th><th>Tanggal Surat</th><th>Hal</th><th>Tanggal Diterima/Dikirim</th><th>Asal/Tujuan</th><th>Aksi</th>
            </tr>
          </thead>
          <tbody id="dataBody"></tbody>
        </table>
      </div>
      <button class="pdf-btn" onclick="downloadPDF()">Download PDF</button>
    </main>
  </div>

  <script>
    const ENDPOINT_MASUK = "https://sheetdb.io/api/v1/f10drm0h22cjz";
    const ENDPOINT_KELUAR = "https://sheetdb.io/api/v1/247yl7pptsbkc";
    let endpointAktif = null;
    let mode = '';

    const akun = {
      umum: "umum123", kesra: "kesra123", ekbang: "ekbang123",
      trantib: "trantib123", pem: "pem123", sekcam: "sekcam123",
      kecamatanseberuang: "seberuang123"
    };

    document.getElementById('loginForm').addEventListener('submit', e => {
      e.preventDefault();
      const u = username.value.trim(), p = password.value.trim();
      if (akun[u] && akun[u] === p) {
        localStorage.setItem('user', u);
        loginPage.classList.add('hidden');
        dashboardPage.classList.remove('hidden');
      } else error.textContent = "Username atau password salah.";
    });

    function logout() {
      localStorage.removeItem('user');
      location.reload();
    }

    btnMasuk.onclick = () => { mode = 'masuk'; pilih('masuk'); };
    btnKeluar.onclick = () => { mode = 'keluar'; pilih('keluar'); };

    function pilih(jenis) {
      endpointAktif = jenis === 'masuk' ? ENDPOINT_MASUK : ENDPOINT_KELUAR;
      formArea.classList.remove('hidden');
      formTitle.textContent = jenis === 'masuk' ? 'Form Surat Masuk' : 'Form Surat Keluar';
      tableTitle.textContent = jenis === 'masuk' ? 'Daftar Surat Masuk' : 'Daftar Surat Keluar';
      tglLabel.textContent = jenis === 'masuk' ? 'Tanggal Diterima' : 'Tanggal Dikirim';
      asalTujuanLabel.textContent = jenis === 'masuk' ? 'Asal Surat' : 'Tujuan Surat';
      loadData();
    }

    suratForm.addEventListener('submit', async e => {
      e.preventDefault();
      if (!endpointAktif) return alert("Pilih jenis surat dulu");

      const data = {
        data: [{
          Nomor: nomor.value,
          Nomor_Surat: nomorSurat.value,
          Tanggal_Surat: tanggalSurat.value,
          Hal: hal.value,
          Tanggal_Diterima_Dikirim: tanggalKirimTerima.value,
          Asal_Tujuan_Surat: asalTujuan.value
        }]
      };

      await fetch(endpointAktif, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(data)
      });
      alert("Data berhasil disimpan!");
      suratForm.reset();
      loadData();
    });

    async function loadData() {
      if (!endpointAktif) return;
      const res = await fetch(endpointAktif);
      const data = await res.json();
      dataBody.innerHTML = "";
      data.forEach((d, i) => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${d.Nomor||""}</td>
          <td>${d.Nomor_Surat||""}</td>
          <td>${d.Tanggal_Surat||""}</td>
          <td>${d.Hal||""}</td>
          <td>${d.Tanggal_Diterima_Dikirim||""}</td>
          <td>${d.Asal_Tujuan_Surat||""}</td>
          <td><button onclick="hapusData(${i})">Hapus</button></td>`;
        dataBody.appendChild(tr);
      });
    }

    async function hapusData(index) {
      if (!confirm("Yakin ingin menghapus data ini?")) return;
      const res = await fetch(endpointAktif);
      const data = await res.json();
      if (data[index]) {
        const idValue = data[index].Nomor; // asumsi kolom Nomor unik
        await fetch(`${endpointAktif}/Nomor/${idValue}`, { method: "DELETE" });
        alert("Data dihapus!");
        loadData();
      }
    }

    // Fungsi Download PDF (versi yang kamu kirim)
    async function downloadPDF() {
      const element = document.getElementById('tableSection');

      // Pastikan elemen terlihat sepenuhnya saat dirender
      element.style.background = '#ffffff';
      element.style.padding = '10px';
      element.scrollIntoView({ behavior: 'instant', block: 'start' });

      // Tunggu sedikit agar render stabil
      await new Promise(resolve => setTimeout(resolve, 500));

      const opt = {
        margin: 0.3,
        filename: `${mode || 'data'}-e-surat.pdf`,
        image: { type: 'jpeg', quality: 1 },
        html2canvas: {
          scale: 3,
          backgroundColor: '#ffffff',
          useCORS: true,
          scrollY: 0
        },
        jsPDF: {
          unit: 'in',
          format: 'a4',
          orientation: 'landscape'
        }
      };

      html2pdf().set(opt).from(element).save();

      // Kembalikan style
      element.style.background = '';
      element.style.padding = '';
    }

    window.onload = () => {
      const user = localStorage.getItem('user');
      if (user) {
        loginPage.classList.add('hidden');
        dashboardPage.classList.remove('hidden');
      }
    };
    <input id="kalimat" placeholder="Tulis kalimat..." />
<button onclick="simpan()">Simpan</button>

<ul id="list"></ul>

<script>
function ambilData() {
    return JSON.parse(localStorage.getItem("daftar_kalimat") || "[]");
}

function simpan() {
    let teks = document.getElementById("kalimat").value;
    if(!teks) return;

    let data = ambilData();
    data.push(teks);

    localStorage.setItem("daftar_kalimat", JSON.stringify(data));
    tampil();
}

function tampil() {
    let data = ambilData();
    let html = "";
    data.forEach(k => html += `<li>${k}</li>`);
    document.getElementById("list").innerHTML = html;
}

tampil();
</script>

</body>
